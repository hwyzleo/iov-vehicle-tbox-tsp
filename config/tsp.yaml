# TBOX-TSP 服务配置（覆盖 common.yaml 中的公共配置）
# 公共配置覆盖示例（按需启用）
common:
  store:
    root: "./data"
  log:
    level: "debug"                       # 默认日志级别（trace/debug/info/warn/error）
    # framework-log schema：file 为 map（CR-005 §4.1 由 Application::setup_logging 解析）
    file:
      enabled: true
      root: "./log"
      max_file_size_mb: 10
      max_files: 5

tsp:
  # device_sn: TBOX设备序列号（也可从全局状态读取）
  # 开发环境使用测试值，生产环境应从 TBOX-PROV 服务获取
  device-sn: "TBOX_DEV_001"

  # FOTA 业务配置
  fota:
    dedup-window-ms: 60000      # 去重窗口
    throttle-interval-ms: 5000  # 节流间隔

  # framework-ipc 配置 (CR-003 §8)
  ipc:
    socket_path: /tmp/tbox-tsp.sock
    downlink_queue_size: 256     # 下行有界队列
    subscriber_queue_size: 64    # 订阅者积压上限
    slow_subscriber_policy: disconnect  # disconnect / drop / reject

  # MQTT daemon IPC socket (CR-003 §1: TSP 使用 tbox::mqtt_client)
  mqtt:
    socket_path: /tmp/tbox-mqtt.sock

  # 业务订阅目录 (CR-004 §4, §11.1) -- TSP 业务 Topic 唯一事实来源
  # MQTT 配置不得复制这些业务条目；Topic 保存模板，不固化设备实例值。
  subscriptions:
    - route_id: fota.uplink
      topic_template: vehicle/{ecu_uid}/up/fota
      direction: UP
      qos: 1
      target: tsp.fota
      mandatory: false
    - route_id: fota.downlink
      topic_template: vehicle/{ecu_uid}/down/fota
      direction: DOWN
      qos: 1
      target: tsp.fota
      mandatory: true
