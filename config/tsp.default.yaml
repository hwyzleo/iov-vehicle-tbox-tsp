# TBOX TSP Service Configuration (production default)
#
# TBOX-TSP-DSN-CR-008 §15.5: 唯一发布默认模板。
# Installed to /etc/tbox/conf.d/tsp.yaml by the tsp-runtime install component.
# Device-local overrides can be placed in the service working directory as
# ./tsp.yaml (framework-config layer 3, highest priority) -- test/dev only.
#
# 边界（TSP-CONFIG-REQ-006 / REQ-007 / §15.5 / §15.6）：
#   - 不含顶层 common:（正式 common 由 BUILD configs/orin/rootfs/etc/tbox/common.yaml
#     唯一提供；本模板只消费）；
#   - 不含 VIN/SN/ECU UID/device-sn 等身份实例值（route 模式不读取 device-sn；
#     身份由 TBOX-PROV 提供，不得写入配置文件）；
#   - 不含完整设备 Topic（仅保存未展开模板 vehicle/{ecu_uid}/...）；
#   - 不含 Token、用户名/密码、证书、私钥、密钥材料或生产 Broker 凭据；
#   - 不含 Store generation/digest、dedup/receipt 状态或设备业务数据；
#   - 不含 mock/fixture/bypass、模拟 MQTT/SOMEIP peer 或测试资产；
#   - 不含个人目录、宿主路径、build tree 或含 .. 的逃逸路径。
# 所有键与代码、schema、SPEC 和 smoke 使用的真实键一致，无无消费者示例键。

tsp:
  # framework-ipc 配置 (CR-003 §8: TSP 读取 tsp.ipc.*)
  # socket_path 遵循 framework-ipc /tmp/tbox-<service>.sock 基线 (§15.5)。
  ipc:
    socket_path: /tmp/tbox-tsp.sock
    downlink_queue_size: 256            # 下行有界队列容量
    slow_subscriber_policy: disconnect  # disconnect / drop / reject

  # MQTT daemon IPC socket (CR-003 §1: TSP 使用 tbox::mqtt_client)
  mqtt:
    socket_path: /tmp/tbox-mqtt.sock

  # 通用 VehicleMessage 网关 (TBOX-TSP-DSN-CR-009 §16.3)
  # 有界资源/allowlist 限制；尖括号值由实现/容量测试回填。
  vehicle_message:
    allowed_services: [vehicle.fota]      # service allowlist（首期固定 vehicle.fota）
    allowed_protocol_version: fota-v1   # 允许的 Envelope protocol_version（不透明串，整串匹配）
    max_envelope_bytes: 16384            # 序列化 Envelope 总长上限
    max_payload_bytes: 8192              # payload(10) 上限（不截断/不分片/不落盘）
    max_in_flight: 64                    # 并发 correlation 上限
    downlink_queue_capacity: 256         # 每 service 下行队列容量
    worker_count: 1                      # correlation 超时收敛 worker 数
    default_exchange_timeout_ms: 2500    # 默认 exchange deadline（须 < SOME/IP Method deadline）

  # Route 映射 (CR-009 §Route 映射)
  routes:
    vehicle.fota:
      uplink: fota.uplink
      downlink: fota.downlink
      target: tsp.fota

  # 业务订阅目录 (CR-004 §11.1, CR-006 §13.3) -- TSP 业务 Topic 唯一事实来源
  # MQTT 配置不得复制这些业务条目；Topic 保存模板，不固化设备实例值。
  # digest 输入为 owner/route_id/topic_template/direction/qos/target/mandatory。
  subscriptions:
    - route_id: fota.uplink
      topic_template: vehicle/{ecu_uid}/up/fota
      direction: UP
      qos: 1
      target: tsp.fota
      mandatory: false
    - route_id: fota.downlink
      topic_template: vehicle/{ecu_uid}/down/fota
      direction: DOWN
      qos: 1
      target: tsp.fota
      mandatory: true
