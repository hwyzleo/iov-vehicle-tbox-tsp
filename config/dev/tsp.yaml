# =============================================================================
# DEVELOPMENT-ONLY - 仅供本地调试/单元/集成测试显式引用
# =============================================================================
# TBOX-TSP-DSN-CR-008 §15.1 / §15.4 / §15.5: config/dev/tsp.yaml 不由
# tsp-runtime 安装，不进入生产包。正式 /etc/tbox/conf.d/tsp.yaml 由
# tsp-runtime 安装 tsp.default.yaml 生成，并由 BUILD Orin overlay 覆盖。
#
# 本文件用于本地调试/测试运行目录：可配置测试 MQTT socket、临时 store 目录
# 或故障注入。使用方式：
#   - 显式以 config_root=config/dev/ 启动（framework 以 <root>/tsp.yaml 加载）；
#   - 或复制为工作目录 ./tsp.yaml（framework-config 第三层、最高优先级覆盖）。
#
# 允许清单（allowlist）约束（TSP-CONFIG-REQ-001 / §15.6）：
#   - 不得包含真实生产 credential、设备身份或生产 Topic；
#   - production profile 拒绝 device-sn 身份实例、测试 fixture、mock 和不受控路径；
#   - 不得改变 framework-store 允许运行时更新参数的事实来源。
# =============================================================================

# TBOX TSP Service Configuration (development override)
# Configuration is loaded via framework-config layered merge:
#   common.yaml -> conf.d/tsp.yaml -> ./tsp.yaml (deep merge, typed, fail-closed)
# All values are read-only at runtime.

# 开发环境 store 路径（避免污染系统目录）
common:
  store:
    root: "./data"
  # CR-008 §15.4: log 配置由 common.yaml 统一提供（framework-log schema）。
  # 如需服务级日志覆盖，使用 framework schema：
  # log:
  #   level: "debug"

tsp:
  # device-sn: TBOX 设备序列号（legacy 模式用于 Topic 拼装；route 模式不读取）
  # 开发环境使用测试占位值；生产环境由 TBOX-PROV 提供，不得写入配置文件。
  # production profile 拒绝此键（身份实例值，TSP-CONFIG-REQ-007）。
  device-sn: "TBOX_DEV_001"

  # framework-ipc 配置 (CR-003 §8: TSP 读取 tsp.ipc.*)
  ipc:
    socket_path: /tmp/tbox-tsp.sock
    downlink_queue_size: 256     # 下行有界队列
    slow_subscriber_policy: disconnect  # disconnect / drop / reject

  # MQTT daemon IPC socket (CR-003 §1: TSP 使用 tbox::mqtt_client)
  mqtt:
    socket_path: /tmp/tbox-mqtt.sock

  # 通用 VehicleMessage 网关 (TBOX-TSP-DSN-CR-009 §16.3) -- 开发环境较小资源上限
  vehicle_message:
    allowed_services: [vehicle.fota]
    allowed_protocol_major: 1
    max_envelope_bytes: 16384
    max_payload_bytes: 8192
    max_in_flight: 64
    downlink_queue_capacity: 256
    worker_count: 1
    default_exchange_timeout_ms: 2500

  # 业务订阅目录 (CR-004 §11.1) -- TSP 业务 Topic 唯一事实来源
  # Topic 保存模板，不固化设备实例值；MQTT 配置不得复制这些业务条目。
  subscriptions:
    - route_id: fota.uplink
      topic_template: vehicle/{ecu_uid}/up/fota
      direction: UP
      qos: 1
      target: tsp.fota
      mandatory: false
    - route_id: fota.downlink
      topic_template: vehicle/{ecu_uid}/down/fota
      direction: DOWN
      qos: 1
      target: tsp.fota
      mandatory: true
