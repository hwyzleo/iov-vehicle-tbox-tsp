# Invalid: qos out of range (schema fail)
tsp:
  ipc:
    socket_path: /tmp/tbox-tsp.sock
    downlink_queue_size: 256
    slow_subscriber_policy: disconnect
  mqtt:
    socket_path: /tmp/tbox-mqtt.sock
  subscriptions:
    - route_id: fota.uplink
      topic_template: vehicle/{ecu_uid}/up/fota
      direction: UP
      qos: 5
      target: tsp.fota
      mandatory: false
