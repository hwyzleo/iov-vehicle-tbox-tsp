# Valid production TSP config (mirrors config/tsp.default.yaml)
# production profile: no top-level common, no device-sn, approved socket paths
tsp:
  ipc:
    socket_path: /tmp/tbox-tsp.sock
    downlink_queue_size: 256
    slow_subscriber_policy: disconnect
  mqtt:
    socket_path: /tmp/tbox-mqtt.sock
  subscriptions:
    - route_id: fota.uplink
      topic_template: vehicle/{ecu_uid}/up/fota
      direction: UP
      qos: 1
      target: tsp.fota
      mandatory: false
    - route_id: fota.downlink
      topic_template: vehicle/{ecu_uid}/down/fota
      direction: DOWN
      qos: 1
      target: tsp.fota
      mandatory: true
