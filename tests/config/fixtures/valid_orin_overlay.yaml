# Valid BUILD Orin overlay simulation (production): only tsp.*, approved sockets
# Simulates configs/orin/rootfs/etc/tbox/conf.d/tsp.yaml after overlay
tsp:
  ipc:
    socket_path: /tmp/tbox-tsp.sock
    downlink_queue_size: 512
    slow_subscriber_policy: drop
  mqtt:
    socket_path: /tmp/tbox-mqtt.sock
  subscriptions:
    - route_id: fota.uplink
      topic_template: vehicle/{ecu_uid}/up/fota
      direction: UP
      qos: 1
      target: tsp.fota
      mandatory: false
    - route_id: fota.downlink
      topic_template: vehicle/{ecu_uid}/down/fota
      direction: DOWN
      qos: 1
      target: tsp.fota
      mandatory: true
