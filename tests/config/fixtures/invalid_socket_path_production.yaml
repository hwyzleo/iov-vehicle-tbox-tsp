# Invalid (production): socket_path not the approved /tmp/tbox-tsp.sock
tsp:
  ipc:
    socket_path: /tmp/custom-tsp.sock
    downlink_queue_size: 256
    slow_subscriber_policy: disconnect
  mqtt:
    socket_path: /tmp/tbox-mqtt.sock
  subscriptions:
    - route_id: fota.uplink
      topic_template: vehicle/{ecu_uid}/up/fota
      direction: UP
      qos: 1
      target: tsp.fota
      mandatory: false
